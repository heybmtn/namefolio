<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>namefolio.co</title>
<meta name="description" content="A premium portfolio of brandable .co.uk domains, focused on ecommerce and home services.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1a1a1f;
    --muted: rgba(26, 26, 31, 0.55);
    --rule: rgba(26, 26, 31, 0.12);
    --periwinkle: #96A9EB;
    --periwinkle-deep: #5866cc;
    --coral: #FF6b74;
  }

  * { box-sizing: border-box; }
  html { height: 100%; -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    overflow-x: hidden;
    color: var(--ink);
    background: var(--bg);
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: clamp(3rem, 12vh, 10rem) clamp(1.5rem, 6vw, 2.5rem) clamp(4.5rem, 12vh, 9rem);
  }

  /* abstract "site plan" backdrop — a portfolio of plots, industry-neutral */
  .plan-bg {
    position: fixed;
    left: 50%;
    bottom: 0;
    width: 100%;
    max-width: 1600px;
    height: clamp(220px, 46vh, 540px);
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 0;
    -webkit-mask-image: linear-gradient(to top, #000 0%, #000 22%, transparent 96%);
    mask-image: linear-gradient(to top, #000 0%, #000 22%, transparent 96%);
  }
  .plan-bg svg { width: 100%; height: 100%; display: block; }
  .plan-bg .grid line {
    stroke: #6f7176;
    stroke-width: 1;
    stroke-opacity: 0.42;
    vector-effect: non-scaling-stroke;
  }
  .plan-bg .plot {
    fill: rgba(150, 169, 235, 0.10);
    stroke: var(--periwinkle-deep);
    stroke-width: 1.5;
    stroke-opacity: 0.7;
    vector-effect: non-scaling-stroke;
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 34rem;
    margin: 0 auto;
  }

  .mark {
    font-size: clamp(1.45rem, 4.5vw, 1.7rem);
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0 0 clamp(2.5rem, 8vh, 4rem);
  }
  .mark .dot { color: var(--periwinkle); }

  .pitch {
    font-size: clamp(2.15rem, 8.5vw, 3.1rem);
    font-weight: 600;
    line-height: 1.18;
    letter-spacing: -0.025em;
    max-width: 15ch;
    margin: 0 0 clamp(3rem, 9vh, 4.75rem);
    text-wrap: balance;
  }

  .section {
    font-size: clamp(0.82rem, 2.2vw, 0.92rem);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--periwinkle-deep);
    margin: 0 0 clamp(1rem, 2.6vw, 1.35rem);
    padding-bottom: clamp(0.75rem, 1.8vw, 0.95rem);
    border-bottom: 1px solid var(--rule);
  }

  .body-text {
    font-size: clamp(1.1rem, 3.2vw, 1.24rem);
    line-height: 1.65;
    color: rgba(26, 26, 31, 0.8);
    max-width: 44ch;
    margin: 0 0 1.2rem;
    text-wrap: pretty;
  }
  .body-text:last-child { margin-bottom: 0; }

  a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 1px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  a:hover { color: var(--coral); border-color: var(--coral); }

  /* phones: raise content, give type edge-to-edge room, keep backdrop calm */
  @media (max-width: 34rem) {
    body { padding: clamp(2.75rem, 9vh, 4rem) 1.35rem 4rem; }
    .mark { margin-bottom: 2.25rem; }
    .pitch {
      font-size: clamp(2.3rem, 10vw, 3rem);
      margin-bottom: 2.75rem;
    }
    .body-text { max-width: none; }
    .plan-bg { height: 40vh; }
  }

  /* very small phones */
  @media (max-width: 22.5rem) {
    body { padding-left: 1.15rem; padding-right: 1.15rem; }
    .pitch { font-size: 2.1rem; }
  }

  /* short / landscape screens: reclaim vertical room */
  @media (max-height: 34rem) {
    body { padding-top: clamp(2rem, 8vh, 3rem); padding-bottom: 3rem; }
    .mark { margin-bottom: 1.75rem; }
    .pitch { margin-bottom: 2.25rem; }
  }

  /* larger screens: a touch more presence */
  @media (min-width: 64rem) {
    main { max-width: 37rem; }
  }
</style>
</head>
<body>
  <div class="plan-bg" aria-hidden="true">
    <svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
      <g class="grid">
        <line x1="0"    y1="0" x2="0"    y2="480"/>
        <line x1="120"  y1="0" x2="120"  y2="480"/>
        <line x1="240"  y1="0" x2="240"  y2="480"/>
        <line x1="360"  y1="0" x2="360"  y2="480"/>
        <line x1="480"  y1="0" x2="480"  y2="480"/>
        <line x1="600"  y1="0" x2="600"  y2="480"/>
        <line x1="720"  y1="0" x2="720"  y2="480"/>
        <line x1="840"  y1="0" x2="840"  y2="480"/>
        <line x1="960"  y1="0" x2="960"  y2="480"/>
        <line x1="1080" y1="0" x2="1080" y2="480"/>
        <line x1="1200" y1="0" x2="1200" y2="480"/>
        <line x1="0" y1="480" x2="1200" y2="480"/>
        <line x1="0" y1="360" x2="1200" y2="360"/>
        <line x1="0" y1="240" x2="1200" y2="240"/>
        <line x1="0" y1="120" x2="1200" y2="120"/>
      </g>
      <g>
        <rect class="plot" x="240" y="360" width="120" height="120"/>
        <rect class="plot" x="600" y="240" width="240" height="120"/>
        <rect class="plot" x="960" y="360" width="120" height="120"/>
      </g>
    </svg>
  </div>

  <main>
    <h1 class="mark">namefolio<span class="dot">.</span></h1>

    <p class="pitch">Domains you can build a business on.</p>

    <h2 class="section">Domains for Sale</h2>
    <p class="body-text">Namefolio manages a premium portfolio of brandable .co.uk domains, focused on ecommerce and home services.</p>
    <p class="body-text">Explore our domains for sale across leading aftermarket marketplaces.</p>
  </main>
</body>
</html>
