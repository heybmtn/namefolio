<style>
  @font-face {
    font-family: 'Instrument Sans';
    font-style: normal;
    font-weight: 400 600;
    font-stretch: 100%;
    font-display: optional;
    src: url('/fonts/instrument-sans.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root {
    --bg: #08090c;
    --ink: #f4f6f2;
    --muted: #c8cac5;
    --rule: rgba(244, 246, 242, 0.12);
    --accent: #d4f542;
  }

  * { box-sizing: border-box; }
  html { height: 100%; -webkit-text-size-adjust: 100%; color-scheme: dark; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    overflow-x: hidden;
    color: var(--ink);
    background:
      radial-gradient(ellipse 80% 50% at 85% 110%, rgba(212, 245, 66, 0.08), transparent 55%),
      var(--bg);
    font-family: 'Instrument Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: clamp(3rem, 10vh, 8rem) clamp(1.75rem, 8vw, 5.5rem) clamp(4.5rem, 12vh, 9rem);
  }

  .plan-bg {
    position: fixed;
    left: 50%;
    bottom: 0;
    width: 100%;
    max-width: 1600px;
    height: clamp(220px, 46vh, 540px);
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 0;
    -webkit-mask-image: linear-gradient(to top, #000 0%, #000 22%, transparent 96%);
    mask-image: linear-gradient(to top, #000 0%, #000 22%, transparent 96%);
  }
  .plan-bg svg { width: 100%; height: 100%; display: block; }
  .plan-bg .grid line {
    stroke: #8b919c;
    stroke-width: 1;
    stroke-opacity: 0.18;
    vector-effect: non-scaling-stroke;
  }
  .plan-bg .plot {
    fill: rgba(212, 245, 66, 0.10);
    stroke: var(--accent);
    stroke-width: 1.5;
    stroke-opacity: 0.55;
    vector-effect: non-scaling-stroke;
    filter: drop-shadow(0 0 18px rgba(212, 245, 66, 0.22));
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 42rem;
    margin: 0;
  }

  .mark {
    font-size: clamp(1.2rem, 3.2vw, 1.35rem);
    font-weight: 500;
    letter-spacing: 0.04em;
    margin: 0 0 clamp(2.75rem, 9vh, 4.5rem);
  }
  .mark .dot { color: var(--accent); }
  .nowrap { white-space: nowrap; }

  .pitch {
    font-size: clamp(2.4rem, 7.2vw, 4.15rem);
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -0.045em;
    max-width: 16ch;
    margin: 0 0 clamp(2.5rem, 7vh, 3.5rem);
    text-wrap: pretty;
  }

  .enquire {
    font-size: clamp(1.2rem, 3vw, 1.45rem);
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: clamp(2.5rem, 7vh, 3.5rem) 0 0.85rem;
  }

  .body-text {
    font-size: clamp(1.05rem, 2.4vw, 1.18rem);
    line-height: 1.7;
    font-weight: 400;
    color: var(--muted);
    max-width: 46ch;
    margin: 0 0 1.2rem;
    text-wrap: pretty;
  }
  .body-text:last-child { margin-bottom: 0; }

  a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 1px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  a:hover { color: var(--accent); border-color: var(--accent); }
  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  @media (max-width: 34rem) {
    body { padding: clamp(2.75rem, 9vh, 4rem) 1.35rem 4rem; }
    .mark { margin-bottom: 2.25rem; }
    .pitch {
      font-size: clamp(2.35rem, 11vw, 3.1rem);
      margin-bottom: 2.75rem;
    }
    .body-text { max-width: none; }
    .plan-bg { height: 40vh; }
  }

  @media (max-width: 22.5rem) {
    body { padding-left: 1.15rem; padding-right: 1.15rem; }
    .pitch { font-size: 2.15rem; }
  }

  @media (max-height: 34rem) {
    body { padding-top: clamp(2rem, 8vh, 3rem); padding-bottom: 3rem; }
    .mark { margin-bottom: 1.75rem; }
    .pitch { margin-bottom: 2.25rem; }
  }

  @media (min-width: 64rem) {
    main { max-width: 44rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    a { transition: none; }
  }
</style>
</head>
<body>
  <div class="plan-bg" aria-hidden="true">
    <svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
      <g class="grid">
        <line x1="0"    y1="0" x2="0"    y2="480"/>
        <line x1="120"  y1="0" x2="120"  y2="480"/>
        <line x1="240"  y1="0" x2="240"  y2="480"/>
        <line x1="360"  y1="0" x2="360"  y2="480"/>
        <line x1="480"  y1="0" x2="480"  y2="480"/>
        <line x1="600"  y1="0" x2="600"  y2="480"/>
        <line x1="720"  y1="0" x2="720"  y2="480"/>
        <line x1="840"  y1="0" x2="840"  y2="480"/>
        <line x1="960"  y1="0" x2="960"  y2="480"/>
        <line x1="1080" y1="0" x2="1080" y2="480"/>
        <line x1="1200" y1="0" x2="1200" y2="480"/>
        <line x1="0" y1="480" x2="1200" y2="480"/>
        <line x1="0" y1="360" x2="1200" y2="360"/>
        <line x1="0" y1="240" x2="1200" y2="240"/>
        <line x1="0" y1="120" x2="1200" y2="120"/>
      </g>
      <g>
        <rect class="plot" x="240" y="360" width="120" height="120"/>
        <rect class="plot" x="600" y="240" width="240" height="120"/>
        <rect class="plot" x="960" y="360" width="120" height="120"/>
      </g>
    </svg>
  </div>

  <main>
    <p class="mark">Namefolio<span class="dot">.</span></p>

    <h1 class="pitch">A portfolio of <span class="nowrap">brandable .co.uk</span> domains.</h1>

    <p class="body-text">Our domains are available through leading aftermarket marketplaces.</p>

    <h2 class="enquire">Looking to acquire a domain?</h2>
    <p class="body-text">Get in touch to discuss available domains and acquisitions.</p>
  </main>
</body>
</html>
