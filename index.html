<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>namefolio.co</title>
<meta name="description" content="Domains you can build a business on. A premium portfolio of brandable .co.uk domains.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1a1a1f;
    --muted: rgba(26, 26, 31, 0.55);
    --rule: rgba(26, 26, 31, 0.12);
    --periwinkle: #96A9EB;
    --periwinkle-deep: #5866cc;
    --coral: #FF6b74;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    color: var(--ink);
    background: var(--bg);
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 15vh 28px 12vh;
  }

  /* line-art construction-site backdrop */
  .site-bg {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.18;
    line-height: 0;
  }
  .site-bg svg { width: 100%; height: auto; display: block; }
  .site-bg svg * {
    fill: none;
    stroke: #6f7176;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
  }

  .mark {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0 0 64px;
  }
  .mark .dot { color: var(--periwinkle); }

  .pitch {
    font-size: 34px;
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -0.02em;
    max-width: 15ch;
    margin: 0 0 72px;
  }

  .section {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--periwinkle-deep);
    margin: 0 0 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--rule);
  }

  .body-text {
    font-size: 17px;
    line-height: 1.7;
    color: rgba(26, 26, 31, 0.78);
    max-width: 48ch;
    margin: 0 0 18px;
  }
  .body-text:last-child { margin-bottom: 0; }

  a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 1px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  a:hover { color: var(--coral); border-color: var(--coral); }

  @media (max-width: 480px) {
    body { padding: 11vh 24px 10vh; }
    .pitch { font-size: 28px; }
    .mark { margin-bottom: 48px; }
    .site-bg { opacity: 0.14; }
  }
</style>
</head>
<body>
  <div class="site-bg" aria-hidden="true">
    <svg viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">
      <!-- ground -->
      <line x1="0" y1="410" x2="1200" y2="410"/>

      <!-- building A: finished, windows -->
      <rect x="70" y="230" width="150" height="180"/>
      <line x1="120" y1="230" x2="120" y2="410"/>
      <line x1="170" y1="230" x2="170" y2="410"/>
      <line x1="70" y1="270" x2="220" y2="270"/>
      <line x1="70" y1="310" x2="220" y2="310"/>
      <line x1="70" y1="350" x2="220" y2="350"/>
      <line x1="70" y1="390" x2="220" y2="390"/>

      <!-- tower crane -->
      <line x1="352" y1="410" x2="352" y2="110"/>
      <line x1="368" y1="410" x2="368" y2="110"/>
      <polyline points="352,410 368,360 352,310 368,260 352,210 368,160 352,110"/>
      <rect x="344" y="86" width="32" height="24"/>
      <line x1="360" y1="86" x2="360" y2="44"/>
      <!-- jib -->
      <line x1="376" y1="98" x2="648" y2="98"/>
      <line x1="360" y1="44" x2="648" y2="98"/>
      <line x1="430" y1="98" x2="430" y2="57"/>
      <line x1="500" y1="98" x2="500" y2="70"/>
      <line x1="570" y1="98" x2="570" y2="83"/>
      <!-- counter-jib + counterweight -->
      <line x1="344" y1="98" x2="250" y2="98"/>
      <line x1="360" y1="44" x2="250" y2="98"/>
      <line x1="300" y1="98" x2="300" y2="73"/>
      <rect x="238" y="98" width="28" height="26"/>
      <!-- hoist cable + load -->
      <line x1="560" y1="98" x2="560" y2="250"/>
      <rect x="544" y="250" width="32" height="14"/>
      <line x1="556" y1="250" x2="556" y2="264"/>

      <!-- building B: under construction (frame) -->
      <line x1="680" y1="410" x2="680" y2="160"/>
      <line x1="760" y1="410" x2="760" y2="160"/>
      <line x1="840" y1="410" x2="840" y2="160"/>
      <line x1="680" y1="350" x2="840" y2="350"/>
      <line x1="680" y1="290" x2="840" y2="290"/>
      <line x1="680" y1="230" x2="840" y2="230"/>
      <line x1="680" y1="190" x2="840" y2="190"/>

      <!-- building C: scaffolded -->
      <rect x="900" y="170" width="180" height="240"/>
      <line x1="960" y1="170" x2="960" y2="410"/>
      <line x1="1020" y1="170" x2="1020" y2="410"/>
      <line x1="900" y1="230" x2="1080" y2="230"/>
      <line x1="900" y1="290" x2="1080" y2="290"/>
      <line x1="900" y1="350" x2="1080" y2="350"/>
      <!-- scaffold poles + lifts -->
      <line x1="892" y1="160" x2="892" y2="410"/>
      <line x1="1088" y1="160" x2="1088" y2="410"/>
      <line x1="892" y1="160" x2="1088" y2="160"/>
      <line x1="892" y1="290" x2="1088" y2="290"/>
      <line x1="892" y1="350" x2="1088" y2="350"/>
      <!-- scaffold cross-bracing -->
      <line x1="892" y1="290" x2="990" y2="230"/>
      <line x1="990" y1="290" x2="1088" y2="230"/>
      <line x1="892" y1="350" x2="990" y2="290"/>
      <line x1="990" y1="350" x2="1088" y2="290"/>
    </svg>
  </div>

  <main>
    <h1 class="mark">namefolio<span class="dot">.</span></h1>

    <p class="pitch">Domains you can build a business on.</p>

    <h2 class="section">Domains for Sale</h2>
    <p class="body-text">Namefolio manages a premium portfolio of brandable .co.uk domains, focused on ecommerce and home services.</p>
    <p class="body-text">Explore our domains for sale across leading aftermarket marketplaces.</p>
  </main>
</body>
</html>
