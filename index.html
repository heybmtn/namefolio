{

  "@graph": [
    {

    {

      "description": "We buy and sell really good .co.uk assets. Buy a specific name or get dedicated outbound sales support for your own domains.",
      "isPartOf": { "@id": "https://namefolio.co/#website" },
      "about": { "@id": "https://namefolio.co/#organization" },

<style>
  :root {
    /* Namefolio palette — unchanged */
    --bg: #08090c;
    --ink: #f4f6f2;
    --muted: #c8cac5;
    --rule: rgba(244, 246, 242, 0.12);
    --rule-soft: rgba(244, 246, 242, 0.07);
    --accent: #d4f542;
    --display: 'Archivo', 'Arial Narrow', Impact, sans-serif;
    --body: 'Instrument Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --edge: clamp(1.15rem, 5vw, 3.25rem);
  }

  * { box-sizing: border-box; }
  html { height: 100%; -webkit-text-size-adjust: 100%; color-scheme: dark; scroll-padding-top: env(safe-area-inset-top, 0px); }

  body {
    margin: 0;
    min-height: 100svh;
    overflow-x: hidden;
    color: var(--ink);
    background: var(--bg);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* faint brand glow, a quiet nod to the old plots motif */
  body::after {
    content: "";
    position: fixed;
    left: 50%;
    bottom: -20vh;
    width: 120vw;
    height: 55vh;
    transform: translateX(-50%);
    background: radial-gradient(ellipse 50% 100% at 50% 100%, rgba(212, 245, 66, 0.08), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: var(--bg); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---------- Nav ---------- */
  .nav {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem var(--edge);
    padding-top: calc(1.1rem + env(safe-area-inset-top, 0px));
    background: linear-gradient(to bottom, var(--bg) 55%, transparent);
  }
  .wordmark {
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    font-stretch: 125%;
  }
  .wordmark .dot { color: var(--accent); }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    z-index: 1;
    padding: clamp(2rem, 8svh, 4.5rem) var(--edge) clamp(0.75rem, 3svh, 2rem);
    text-align: center;
  }
  .statement {
    margin: 0 auto;
    font-family: var(--display);
    font-weight: 800;
    font-stretch: 125%;
    text-transform: uppercase;
    letter-spacing: -0.015em;
    line-height: 0.88;
    font-size: clamp(3rem, 13.5vw, 7rem);
  }
  .statement .line { display: block; overflow: hidden; }
  .statement .line > span {
    display: block;
    transform: translateY(105%);
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .statement .line:nth-child(1) > span { animation-delay: 0.05s; }
  .statement .line:nth-child(2) > span { animation-delay: 0.14s; }
  .statement .line:nth-child(3) > span { animation-delay: 0.23s; }
  .statement .dot { color: var(--accent); }
  @keyframes rise { to { transform: translateY(0); } }

  .hero-sub {
    margin: clamp(1.75rem, 4vh, 2.5rem) auto 0;
    max-width: 46ch;
    color: var(--muted);
    font-size: clamp(1.02rem, 2.2vw, 1.2rem);
    line-height: 1.6;
    text-wrap: pretty;
    opacity: 0;
    animation: fade 0.7s ease 0.5s forwards;
  }
  @keyframes fade { to { opacity: 1; } }

  .cta {
    display: inline-block;
    margin-top: clamp(0.75rem, 2.5svh, 1.5rem);
    padding: 0.85rem 1.6rem;
    background: var(--accent);
    color: var(--bg);
    font-family: var(--body);
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: -0.01em;
    border: 0;
    cursor: pointer;
    opacity: 0;
    animation: fade 0.7s ease 0.62s forwards;
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  .cta:hover { filter: brightness(1.08); }
  .cta:active { transform: translateY(1px); }

  /* ---------- Portfolio wall ---------- */
  .portfolio {
    position: relative;
    z-index: 1;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: clamp(1rem, 3.5svh, 2rem) 0;
    margin-top: clamp(0.5rem, 2.5svh, 1.25rem);
  }
  .portfolio-label {
    display: block;
    text-align: center;
    font-family: var(--display);
    font-weight: 800;
    font-stretch: 125%;
    text-transform: uppercase;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    color: var(--muted);
    margin-bottom: clamp(0.5rem, 2svh, 1.25rem);
  }
  .marquee {
    position: relative;
    display: flex;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent);
    mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent);
  }
  .marquee + .marquee { margin-top: 0.9rem; }
  .track {
    display: flex;
    flex: none;
    align-items: center;
    gap: 0;
    padding-right: 0;
    white-space: nowrap;
    will-change: transform;
    animation: scroll 60s linear infinite;
  }
  .marquee--reverse .track { animation-direction: reverse; animation-duration: 74s; }
  .marquee:hover .track { animation-play-state: paused; }
  @keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0 clamp(1.25rem, 3vw, 2.25rem);
    font-size: clamp(1.15rem, 2.6vw, 1.65rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--ink);
    transition: color 0.15s ease;
  }
  a.chip:hover { color: var(--accent); }
  .chip .sep { color: var(--rule); font-weight: 400; }
  .chip .status { width: 0.42rem; height: 0.42rem; border-radius: 50%; flex: none; }
  .chip .status.available { background: var(--accent); box-shadow: 0 0 10px rgba(212, 245, 66, 0.6); }
  .chip .status.sold { background: var(--rule); }
  .chip.is-sold { color: var(--muted); }

  /* ---------- What we do ---------- */
  .about {
    position: relative;
    z-index: 1;
    padding: clamp(3rem, 9vh, 6rem) var(--edge);
    display: grid;
    gap: clamp(1.75rem, 5vw, 3.5rem);
    max-width: 68rem;
    margin: 0 auto;
  }
  @media (min-width: 44rem) {
    .about { grid-template-columns: 1fr 1fr; }
  }
  .about h2 {
    margin: 0 0 0.6rem;
    font-family: var(--display);
    font-weight: 700;
    font-stretch: 110%;
    text-transform: uppercase;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
  }
  .about p {
    margin: 0;
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.65;
    max-width: 44ch;
    text-wrap: pretty;
  }
  .about .lead { color: var(--ink); }

  /* ---------- Footer ---------- */
  footer {
    position: relative;
    z-index: 1;
    border-top: 1px solid var(--rule);
    padding: clamp(2rem, 5vh, 3rem) var(--edge) clamp(2.5rem, 6vh, 3.5rem);
    display: flex;
    flex-wrap: wrap;
    gap: 1rem 2rem;
    align-items: baseline;
    justify-content: space-between;
  }
  .footer-mail {
    font-family: var(--display);
    font-weight: 700;
    font-stretch: 110%;
    font-size: clamp(1.15rem, 3.5vw, 1.75rem);
    letter-spacing: -0.01em;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 2px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .footer-mail:hover { color: var(--accent); border-color: var(--accent); }
  .footer-meta { display: flex; gap: 1.5rem; font-size: 0.85rem; color: var(--muted); }
  .footer-meta a { border-bottom: 1px solid var(--rule-soft); padding-bottom: 1px; }
  .footer-meta a:hover { color: var(--ink); }

  /* ---------- Enquire dialog ---------- */
  .enquire-dialog {
    width: min(28rem, calc(100vw - 2.4rem));
    max-height: calc(100svh - 2.4rem);
    margin: auto;
    padding: 1.6rem 1.5rem 1.45rem;
    overflow: auto;
    border: 1px solid rgba(212, 245, 66, 0.5);
    background: var(--bg);
    color: var(--ink);
    box-shadow: 0 0 40px rgba(212, 245, 66, 0.12);
  }
  .enquire-dialog::backdrop { background: rgba(8, 9, 12, 0.72); backdrop-filter: blur(3px); }
  .enquire-dialog[open] { animation: pop 0.18s ease forwards; }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
  }
  .enquire-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.15rem;
  }
  .enquire-head h2 {
    margin: 0;
    font-family: var(--display);
    font-weight: 800;
    font-stretch: 125%;
    text-transform: uppercase;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
  }
  .enquire-close {
    flex: none;
    width: 2rem;
    height: 2rem;
    margin: -0.35rem -0.4rem 0 0;
    padding: 0;
    border: 0;
    background: none;
    color: var(--muted);
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
  }
  .enquire-close:hover { color: var(--ink); }
  .enquire-form { display: flex; flex-direction: column; gap: 0.85rem; }
  .enquire-field { display: flex; flex-direction: column; gap: 0.35rem; }
  .enquire-field label { font-size: 0.85rem; color: var(--muted); }
  .enquire-field input,
  .enquire-field textarea {
    width: 100%;
    padding: 0.65rem 0.75rem;
    border: 1px solid var(--rule);
    background: rgba(244, 246, 242, 0.04);
    color: var(--ink);
    font: inherit;
    font-size: 1rem;
    border-radius: 0;
  }
  .enquire-field textarea { min-height: 6.5rem; resize: vertical; }
  .enquire-submit {
    align-self: flex-start;
    margin-top: 0.25rem;
    padding: 0.7rem 1.3rem;
    border: 0;
    background: var(--accent);
    color: var(--bg);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .enquire-submit:hover { filter: brightness(1.07); }

  @media (max-width: 44rem) {
    .hero { padding-bottom: clamp(0.5rem, 1.5svh, 1rem); }
    .portfolio { margin-top: clamp(0.25rem, 1svh, 0.5rem); padding: clamp(0.5rem, 1.75svh, 1rem) 0; }
    .portfolio-label { margin-bottom: clamp(0.25rem, 1svh, 0.5rem); }
  }

  @media (max-height: 28rem) {
    .statement { font-size: clamp(1.6rem, 9vw, 3.5rem); }
    .hero { padding-top: clamp(0.6rem, 4svh, 1.25rem); padding-bottom: clamp(0.4rem, 1.5svh, 0.75rem); }
    .cta { margin-top: clamp(0.4rem, 1.25svh, 0.75rem); }
    .portfolio { margin-top: clamp(0.2rem, 0.75svh, 0.4rem); padding: clamp(0.4rem, 1.25svh, 0.7rem) 0; }
    .portfolio-label { margin-bottom: clamp(0.2rem, 0.75svh, 0.4rem); }
  }

  @media (prefers-reduced-motion: reduce) {
    .statement .line > span,
    .hero-sub,
    .cta { animation: none; transform: none; opacity: 1; }
    .track { animation: none; }
    .enquire-dialog[open] { animation: none; }
  }
</style>
</head>
<body>
  <header class="nav">
    <a class="wordmark" href="/">Namefolio<span class="dot">.</span></a>
  </header>

  <main>
    <section class="hero">
      <h1 class="statement">
        <span class="line"><span>Really good</span></span>
        <span class="line"><span>.co.uk</span></span>
        <span class="line"><span>domains<span class="dot">.</span></span></span>
      </h1>
      <button type="button" class="cta" data-enquire>Get in touch</button>
    </section>

    <section class="portfolio" aria-label="Domains">
      <span class="portfolio-label">The domains</span>

      <div class="marquee" aria-hidden="true">
        <div class="track" data-row="1"></div>
      </div>
      <div class="marquee marquee--reverse" aria-hidden="true">
        <div class="track" data-row="2"></div>
      </div>
    </section>

    <section class="about" id="about">
      <div>
        <h2>Buy a name</h2>
        <p class="lead">Clean, keyword-strong .co.uk domains suited to real businesses.</p>
      </div>
      <div>
        <h2>Sell a name</h2>
        <p>Sitting on names you'd rather sell? We run dedicated outbound sales to put them in front of the right buyers.</p>
      </div>
    </section>
  </main>

  <footer>
    <a class="footer-mail" href="mailto:hello@namefolio.co">hello@namefolio.co</a>
    <div class="footer-meta">
      <a href="/llms.txt">llms.txt</a>
    </div>
  </footer>

  <dialog class="enquire-dialog" id="enquire-dialog" aria-labelledby="enquire-title">
    <div class="enquire-head">
      <h2 id="enquire-title">Get in touch</h2>
      <button type="button" class="enquire-close" aria-label="Close">&times;</button>
    </div>
    <form class="enquire-form" id="enquire-form">
      <div class="enquire-field">
        <label for="enquire-name">Name</label>
        <input id="enquire-name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="enquire-field">
        <label for="enquire-email">Email</label>
        <input id="enquire-email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="enquire-field">
        <label for="enquire-message">Message</label>
        <textarea id="enquire-message" name="message" rows="4" required></textarea>
      </div>
      <button type="submit" class="enquire-submit">Send</button>
    </form>
  </dialog>

  <script>
    /* ---------------------------------------------------------------
       PORTFOLIO — your inventory.
       status: 'available' | 'sold' (drop status to leave it plain)
       Available names become clickable chips that open the enquiry form.
       --------------------------------------------------------------- */
    var DOMAINS = [
      { name: 'outdoorsurvival.co.uk', status: 'available' },
      { name: 'cyberfleet.co.uk', status: 'available' },
      { name: 'nomadcamping.co.uk', status: 'available' },
      { name: 'valuestorage.co.uk', status: 'available' },
      { name: 'prototypeservices.co.uk', status: 'available' },
      { name: 'antiquebuyer.co.uk', status: 'available' }
    ];

    (function () {
      function chip(d) {
        var a = document.createElement(d.status === 'available' ? 'a' : 'span');
        a.className = 'chip' + (d.status === 'sold' ? ' is-sold' : '');
        if (d.status === 'available') {
          a.href = '#';
          a.setAttribute('data-enquire', '');
        }
        var html = '';
        if (d.status) html += '<span class="status ' + d.status + '"></span>';
        html += d.name + '<span class="sep">/</span>';
        a.innerHTML = html;
        return a;
      }

      function fill(track, list) {
        // duplicate the list so the -50% scroll loops seamlessly
        var doubled = list.concat(list);
        doubled.forEach(function (d) { track.appendChild(chip(d)); });
      }

      var row1 = document.querySelector('[data-row="1"]');
      var row2 = document.querySelector('[data-row="2"]');

      // offset the second row so the two lines don't march in lockstep
      var half = Math.ceil(DOMAINS.length / 2);
      fill(row1, DOMAINS);
      fill(row2, DOMAINS.slice(half).concat(DOMAINS.slice(0, half)));
    })();

    /* ---------- Enquire dialog ---------- */
    (function () {
      var dialog = document.getElementById('enquire-dialog');
      var closeBtn = dialog.querySelector('.enquire-close');
      var form = document.getElementById('enquire-form');

      document.addEventListener('click', function (e) {
        var trigger = e.target.closest('[data-enquire]');
        if (trigger) {
          e.preventDefault();
          if (typeof dialog.showModal === 'function') dialog.showModal();
          return;
        }
      });

      closeBtn.addEventListener('click', function () {
        dialog.close();
      });

      dialog.addEventListener('click', function (event) {
        var box = dialog.getBoundingClientRect();
        var inside =
          event.clientX >= box.left &&
          event.clientX <= box.right &&
          event.clientY >= box.top &&
          event.clientY <= box.bottom;
        if (!inside) dialog.close();
      });

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var name = document.getElementById('enquire-name').value.trim();
        var email = document.getElementById('enquire-email').value.trim();
        var message = document.getElementById('enquire-message').value.trim();
        if (!name || !email || !message) return;

        var subject = encodeURIComponent('Enquiry from ' + name);
        var body = encodeURIComponent('Name: ' + name + '\nEmail: ' + email + '\n\n' + message);
        window.location.href = 'mailto:hello@namefolio.co?subject=' + subject + '&body=' + body;
        dialog.close();
      });
    })();
  </script>
</body>
</html>
